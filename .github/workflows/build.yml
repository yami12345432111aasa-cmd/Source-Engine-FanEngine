name: Build Fan Engine Editor (Windows Portable)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - 'config/**'
      - 'assets/**'
      - 'data/**'
      - 'resources/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
        shell: pwsh
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package portable folder
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter FanEngineEditor.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "FanEngineEditor.exe not found" }
          $stage = "FanEngine-Windows"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe.FullName $stage
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime --no-translations "$stage\FanEngineEditor.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          foreach ($folder in @("assets", "config", "data", "resources")) {
            if (Test-Path $folder) { Copy-Item $folder $stage -Recurse -Force }
          }
          Compress-Archive -Path $stage -DestinationPath FanEngine-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FanEngine-Windows-Portable
          path: FanEngine-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
