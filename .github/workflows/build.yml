name: Build Fan Engine Editor (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 (MSVC + Ninja)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Show compiler and Qt paths
        shell: pwsh
        run: |
          where.exe cl
          cmake --version
          ninja --version
          Write-Host "Qt root: $env:QT_ROOT_DIR"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build editor
        run: cmake --build build --parallel

      - name: Upload Windows editor
        uses: actions/upload-artifact@v4
        with:
          name: FanEngine-Editor-Windows
          path: build/FanEngineEditor.exe
          if-no-files-found: error
          retention-days: 14
