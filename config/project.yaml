project:
  name: Fan Engine
  version: 0.2.0
  editor: FanEngineEditor

build:
  system: CMake
  language: C++
  standard: 17
  qt: "6.5+"
  targets:
    - Windows x64

folders:
  source: src
  configuration: config
  assets: assets
  data: data
  resources: resources

platforms:
  windows:
    status: configured
  linux:
    status: planned
  playstation_3:
    status: planned
    note: Requires a compatible toolchain and legally obtained SDK.

features:
  - Scene hierarchy
  - Basic scene save/load
  - Object creation
  - Inspector overview
  - Output console
  - Qt desktop UI
